version: '3.8'

services:
  # Application PHP eShop (Apache)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      ENVIRONMENT: development
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLUSER: ${MYSQL_USER}
      MYSQLPASSWORD: ${MYSQL_PASSWORD}
      MYSQLDATABASE: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volume mounts for development with Apache
      - .:/var/www/html
      - /var/www/html/vendor              # Ignore vendor local
      - /var/www/html/storage             # Ignore storage logs/cache
      - /var/www/html/public/uploads      # Ignore uploads
    networks:
      - eshop-network

  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: eshop-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eshop_db}
      MYSQL_USER: ${MYSQL_USER:-eshop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eshop_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Persister les données MySQL entre les redémarrages
      - mysql-data:/var/lib/mysql
      # Importer les fichiers SQL initialement
      - ./countries.sql:/docker-entrypoint-initdb.d/01-countries.sql:ro
      - ./eshop_vendor.sql:/docker-entrypoint-initdb.d/02-eshop_vendor.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - eshop-network

  # Client MySQL optionnel (adminer)
  adminer:
    image: adminer:latest
    container_name: eshop-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - eshop-network

volumes:
  mysql-data:
    driver: local

networks:
  eshop-network:
    driver: bridge
